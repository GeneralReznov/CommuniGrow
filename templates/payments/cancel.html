{% extends "base.html" %}

{% block title %}Checkout Canceled - Community Platform{% endblock %}

{% block content %}
<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm border-0 text-center p-4 p-md-5">
                <div class="text-secondary mb-3"><i class="fas fa-circle-xmark fa-3x"></i></div>
                <h1 class="h3">Checkout canceled</h1>
                <p class="text-muted">No payment was taken. You can return to the marketplace whenever you are ready.</p>
                <a class="btn btn-outline-primary mt-3" href="{{ return_url or '/food/marketplace' }}">
                    <i class="fas fa-arrow-left me-2"></i>Back to marketplace
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
